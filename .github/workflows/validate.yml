name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate against published schemas
        run: |
          pip install jsonschema
          python scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Claude Code plugin and marketplace
        run: npx -y @anthropic-ai/claude-code plugin validate .

      - name: Gemini CLI extension
        run: npx -y @google/gemini-cli extensions validate .
